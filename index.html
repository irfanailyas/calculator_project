<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>
    <main class="calculator">
        <h1 class="heading">Calculator</h1>
        <form id="calc-form" novalidate>
            <div class="field">
                <label for="num1">First Number</label>
                <input type="number" id="num1" value="num1" autocomplete="off">
            </div>
            </div><label for="num2">Second Number</label>
            <input type="number" id="num2" value="num2" autocomplete="off">
            </div>

            <div class="section-label">
                <div class="button-grid">
                    <button type="button" class="op" id="add" name="addition"><i class="fa-solid fa-plus"></i></button>
                    <button type="button" class="op" id="subtract" name="subtraction"><i class="fa-solid fa-minus"></i></button>
                    <button type="button" class="op" id="divide" name="division"><i class="fa-solid fa-divide"></i></button>
                    <button type="button" class="op" id="multiply" name="multiplication"><i class="fa-solid fa-xmark"></i></button> <br>
                    <button type="button" class="op" id="square" name="square">x²</button>
                    <button type="button" class="op" id="cube" name="cube">x³</button>
                </div>
            </div>
            <button type="reset" id="clear" class="clear" >Clear</button>
        </form>
        <div class="result-box">
            <div id="expression" class="expression"></div>
            <div id="result" class="result">0</div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>

</html>
